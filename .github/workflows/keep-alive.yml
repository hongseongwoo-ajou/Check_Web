name: Keep Render Server Awake

on:
  schedule:
    # 08:00-12:50 UTC = 17:00-21:50 KST, every 10 minutes
    - cron: "*/10 8-12 * * *"
    # 13:00 UTC = 22:00 KST, final ping of the window
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -sf -o /dev/null -w "status: %{http_code}\n" https://check-web-n84i.onrender.com/health
