<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <script src="../css/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 정보 - 체스 동아리</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <header class="profile-header">
        <a href="../lobby/lobby.html" class="btn-back" data-i18n="common.backToLobby">&#8592; 로비로 돌아가기</a>
        <div class="header-logo">♟ Chess Club</div>
        <div class="header-actions">
            <div class="lang-switcher">
                <button class="lang-btn" data-lang="ko">한</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
            <button id="theme-toggle" class="theme-toggle-btn" title="테마 전환">🌙</button>
            <button id="btn-logout" class="btn-logout" data-i18n="common.logout">로그아웃</button>
        </div>
    </header>

    <main class="profile-main">
        <h1 class="page-title" data-i18n="profile.pageTitle">내 정보</h1>

        <!-- 종합 전적 요약 -->
        <section class="profile-card">
            <h2 class="card-heading" data-i18n="profile.summaryHeading">종합 전적</h2>
            <div id="stats-summary-grid" class="stats-summary-grid">
                <p class="stats-loading" data-i18n="common.loading">불러오는 중...</p>
            </div>
        </section>

        <!-- 레이팅 변화 추이 -->
        <section class="profile-card">
            <div class="chart-heading-row">
                <h2 class="card-heading no-border" data-i18n="profile.ratingTrendHeading">레이팅 변화 추이 (래피드)</h2>
                <div id="rating-period-tabs" class="period-tabs">
                    <button class="period-tab" data-period="7d" data-i18n="profile.period7d">7일</button>
                    <button class="period-tab active" data-period="30d" data-i18n="profile.period30d">30일</button>
                    <button class="period-tab" data-period="1y" data-i18n="profile.period1y">1년</button>
                    <button class="period-tab" data-period="all" data-i18n="profile.periodAll">전체</button>
                </div>
            </div>
            <div class="rating-chart-wrap">
                <canvas id="rating-chart" height="220"></canvas>
                <p id="rating-chart-loading" class="stats-loading hidden" data-i18n="profile.chartLoading">Chess.com에서 대국 기록을 불러오는 중... (최초 조회 시 다소 걸릴 수 있어요)</p>
                <p id="rating-chart-empty" class="stats-empty hidden"></p>
            </div>
        </section>

        <!-- 최근 폼 -->
        <section class="profile-card">
            <h2 class="card-heading" data-i18n="profile.recentFormHeading">최근 폼</h2>
            <div id="recent-form-row" class="recent-form-row">
                <p class="stats-loading" data-i18n="common.loading">불러오는 중...</p>
            </div>
        </section>

        <!-- 주요 라이벌 전적 -->
        <section class="profile-card">
            <h2 class="card-heading" data-i18n="profile.rivalsHeading">주요 라이벌 전적</h2>
            <div id="rivals-list" class="rivals-list">
                <p class="stats-loading" data-i18n="common.loading">불러오는 중...</p>
            </div>
        </section>

        <!-- 기본 정보 -->
        <section class="profile-card">
            <h2 class="card-heading" data-i18n="profile.basicInfoHeading">기본 정보</h2>
            <div class="field-group">
                <label class="field-label" data-i18n="profile.usernameLabel">아이디</label>
                <span id="display-username" class="field-readonly">-</span>
            </div>
            <div class="field-group">
                <label class="field-label" for="input-nickname" data-i18n="profile.nicknameLabel">이름</label>
                <input type="text" id="input-nickname" class="field-input" maxlength="20" placeholder="이름 입력" data-i18n-placeholder="profile.nicknamePlaceholder">
            </div>
            <div class="card-footer">
                <p id="profile-msg" class="status-msg"></p>
                <button id="btn-save-profile" class="btn-save" data-i18n="profile.save">저장</button>
            </div>
        </section>

        <!-- Chess.com 연동 -->
        <section class="profile-card">
            <h2 class="card-heading" data-i18n="profile.chessComHeading">Chess.com 연동</h2>
            <div class="chess-rating-row" id="chess-rating-row">
                <div class="rating-item" id="rapid-display">
                    <span class="rating-label" data-i18n="profile.rapidLabel">래피드</span>
                    <span class="rating-value" id="display-rapid">-</span>
                </div>
                <div class="rating-divider"></div>
                <div class="rating-item">
                    <span class="rating-label" data-i18n="profile.lastUpdatedLabel">마지막 갱신</span>
                    <span class="rating-value" id="display-updated">-</span>
                </div>
            </div>
            <div class="field-group">
                <label class="field-label" for="input-chess-username" data-i18n="profile.chessUsernameLabel">Chess.com 아이디</label>
                <input type="text" id="input-chess-username" class="field-input"
                       placeholder="Chess.com 아이디 입력" data-i18n-placeholder="profile.chessUsernamePlaceholder" autocomplete="off" spellcheck="false">
            </div>
            <div class="card-footer">
                <p id="chess-msg" class="status-msg"></p>
                <div class="btn-row">
                    <button id="btn-refresh-chess" class="btn-outline" data-i18n="profile.refreshRating">레이팅 새로고침</button>
                    <button id="btn-save-chess" class="btn-save" data-i18n="profile.saveAndFetch">저장 및 조회</button>
                </div>
            </div>
        </section>

        <!-- 비밀번호 변경 -->
        <section class="profile-card">
            <h2 class="card-heading" data-i18n="profile.passwordHeading">비밀번호 변경</h2>
            <div class="field-group">
                <label class="field-label" for="input-current-pw" data-i18n="profile.currentPasswordLabel">현재 비밀번호</label>
                <input type="password" id="input-current-pw" class="field-input" placeholder="현재 비밀번호 입력" data-i18n-placeholder="profile.currentPasswordPlaceholder">
            </div>
            <div class="field-group">
                <label class="field-label" for="input-new-pw" data-i18n="profile.newPasswordLabel">새 비밀번호</label>
                <input type="password" id="input-new-pw" class="field-input" placeholder="새 비밀번호 (4자 이상)" data-i18n-placeholder="profile.newPasswordPlaceholder">
            </div>
            <div class="field-group">
                <label class="field-label" for="input-confirm-pw" data-i18n="profile.confirmPasswordLabel">새 비밀번호 확인</label>
                <input type="password" id="input-confirm-pw" class="field-input" placeholder="새 비밀번호 다시 입력" data-i18n-placeholder="profile.confirmPasswordPlaceholder">
            </div>
            <div class="card-footer">
                <p id="password-msg" class="status-msg"></p>
                <button id="btn-change-password" class="btn-save" data-i18n="profile.changePassword">비밀번호 변경</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23/dist/umd/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-http-backend@2/i18nextHttpBackend.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@7/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="../css/i18n-init.js"></script>
    <script src="../css/theme-toggle.js"></script>
    <script src="profile.js"></script>
</body>

</html>
